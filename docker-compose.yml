# Same file for staging and production. Each lives in /opt/talenco-web/<stage>/ with its own .env:
#   COMPOSE_PROJECT_NAME=talenco-web-<stage>   IMAGE=ghcr.io/developerherdento/talenco-web:<tag>   PORT=8001
#   + every key from .env.example (secrets are read at runtime; NEXT_PUBLIC_* must match the image's build args).
# Supabase, Upstash, Resend, Xendit and payment-service are external, so there is no database container.
services:
  web:
    image: ${IMAGE:?set IMAGE in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000" # container port; PORT in .env is the host port used below, so it is overridden here
    ports:
      - "127.0.0.1:${PORT:?set PORT in .env}:3000" # localhost only; host nginx + TLS is the public entry
    healthcheck: # app/api/health returns 200 while the server is up (no dependency checks)
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 3
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
